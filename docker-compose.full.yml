version: '3.8'

services:
  # ===========================================================================
  # Neo4j 图数据库
  # ===========================================================================
  neo4j:
    image: neo4j:5.26.0-enterprise
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - /data/ontology/neo4j/data:/data
      - /data/ontology/neo4j/logs:/logs
      - /data/ontology/neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me_neo4j_password}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc", "n10s"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=2g
      - NEO4J_server_memory_pagecache_size=1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ontology-net

  # ===========================================================================
  # MySQL 5.7 关系型数据库
  # ===========================================================================
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - /data/ontology/mysql/data:/var/lib/mysql
      - /data/ontology/mysql/conf:/etc/mysql/conf.d
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change_me_mysql_root_password}
      - MYSQL_DATABASE=${MYSQL_DB:-it_ops}
      - MYSQL_USER=${MYSQL_USER:-app_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change_me_mysql_password}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=1G
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ontology-net

  # ===========================================================================
  # Zookeeper (Kafka 依赖)
  # ===========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - /data/ontology/zookeeper/data:/var/lib/zookeeper/data
      - /data/ontology/zookeeper/log:/var/lib/zookeeper/log
    networks:
      - ontology-net

  # ===========================================================================
  # Kafka
  # ===========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - /data/ontology/kafka/data:/var/lib/kafka/data
    networks:
      - ontology-net

  # ===========================================================================
  # Debezium (CDC)
  # ===========================================================================
  debezium:
    image: quay.io/debezium/connect:2.4
    container_name: debezium
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: 'kafka:29092'
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: 'my_connect_configs'
      OFFSET_STORAGE_TOPIC: 'my_connect_offsets'
      STATUS_STORAGE_TOPIC: 'my_connect_statuses'
    networks:
      - ontology-net

  # ===========================================================================
  # Langfuse - PostgreSQL (主数据库)
  # ===========================================================================
  langfuse-db:
    image: postgres:15
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${LANGFUSE_POSTGRES_PASSWORD:-change_me_postgres_password}
      - POSTGRES_DB=${LANGFUSE_POSTGRES_DB:-langfuse}
    ports:
      - "5432:5432"
    volumes:
      - /data/ontology/langfuse/db_data:/var/lib/postgresql/data
    networks:
      - ontology-net

  # ===========================================================================
  # Langfuse - Redis (事件队列)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ontology-net

  # ===========================================================================
  # Langfuse - ClickHouse (分析数据)
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: langfuse-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}
    ports:
      - "8123:8123"
      - "9001:9000"
    volumes:
      - /data/ontology/langfuse/clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - ontology-net

  # ===========================================================================
  # Langfuse - MinIO (对象存储)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: langfuse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${LANGFUSE_MINIO_ACCESS_KEY:-change_me_minio_access_key}
      - MINIO_ROOT_PASSWORD=${LANGFUSE_MINIO_SECRET_KEY:-change_me_minio_secret_key}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - /data/ontology/langfuse/minio_data:/data
    networks:
      - ontology-net

  minio-init:
    image: minio/mc:latest
    container_name: langfuse-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $${LANGFUSE_MINIO_ACCESS_KEY:-change_me_minio_access_key} $${LANGFUSE_MINIO_SECRET_KEY:-change_me_minio_secret_key}); do echo 'Waiting for MinIO...' && sleep 2; done;
      /usr/bin/mc mb myminio/langfuse-events --ignore-existing;
      exit 0;
      "
    networks:
      - ontology-net

  # ===========================================================================
  # Langfuse 主程序
  # ===========================================================================
  langfuse:
    image: langfuse/langfuse:3
    container_name: langfuse
    restart: unless-stopped
    depends_on:
      - langfuse-db
      - redis
      - clickhouse
      - minio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-change_me_postgres_password}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=
      - CLICKHOUSE_URL=http://default:${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}@clickhouse:8123/langfuse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}@clickhouse:9000/langfuse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-change_me_nextauth_secret}
      - SALT=${LANGFUSE_SALT:-change_me_langfuse_salt}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      - LANGFUSE_INIT_ORG_ID=default
      - LANGFUSE_INIT_ORG_NAME=MyOrganization
      - LANGFUSE_INIT_PROJECT_ID=default
      - LANGFUSE_INIT_PROJECT_NAME=ontologyAgent
      - LANGFUSE_INIT_USER_EMAIL=admin@example.com
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-change_me_langfuse_admin_password}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_MINIO_ACCESS_KEY:-change_me_minio_access_key}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_SECRET_KEY:-change_me_minio_secret_key}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
    networks:
      - ontology-net

  # ===========================================================================
  # Langfuse Worker (事件处理)
  # ===========================================================================
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      - langfuse-db
      - redis
      - clickhouse
      - minio
    environment:
      - DATABASE_URL=postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:-change_me_postgres_password}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=
      - CLICKHOUSE_URL=http://default:${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}@clickhouse:8123/langfuse
      - CLICKHOUSE_MIGRATION_URL=clickhouse://default:${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}@clickhouse:9000/langfuse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_HTTP_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${LANGFUSE_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - SALT=${LANGFUSE_SALT:-change_me_langfuse_salt}
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse-events
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_MINIO_ACCESS_KEY:-change_me_minio_access_key}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_MINIO_SECRET_KEY:-change_me_minio_secret_key}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
    networks:
      - ontology-net

  # ===========================================================================
  # 后端 API 服务
  # ===========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: ontology-backend
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./ontology_workspace:/app/ontology_workspace
      - ./database_mapping.yaml:/app/database_mapping.yaml
      - ./datasources.yaml:/app/datasources.yaml
      - ./.env:/app/.env
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ontology-net

  # ===========================================================================
  # 前端 Nginx 服务
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: ontology-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - ontology-net

networks:
  ontology-net:
    name: ontology-intelligence-net
    driver: bridge
